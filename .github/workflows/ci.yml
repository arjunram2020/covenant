# CI gate + dependency-audit reporting. Typecheck is a hard gate (change
# management: broken code can't merge). The audit job is informational for now
# (continue-on-error) so a noisy transitive advisory can't block shipping —
# Dependabot handles the actual remediation. Tighten to a hard gate once the
# advisory backlog is clean.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck (nextjs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn workspace @covenant/nextjs typecheck

  contracts:
    name: Contracts (compile + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Compile contracts
        run: yarn workspace @covenant/hardhat compile
      - name: Run contract tests (incl. security suite)
        run: yarn workspace @covenant/hardhat test

  hydration-smoke:
    # Guard against "the page renders but the app is dead": builds the real
    # production bundle (with its strict CSP), serves it, and loads every page
    # in headless Chrome. Fails if any page throws (e.g. a CSP violation) or if
    # React never hydrates (no ConnectButton in the header). This is the gate
    # that catches CSP/header changes that typecheck and build can't see —
    # exactly what silently broke the whole frontend on 2026-07-27.
    name: Hydration smoke (prod build + CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build (production)
        run: yarn workspace @covenant/nextjs build
      - name: Start prod server
        working-directory: packages/nextjs
        run: |
          nohup npx next start -p 3010 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3010 > /dev/null && exit 0
            sleep 1
          done
          echo "server never came up" && cat /tmp/next-start.log && exit 1
      - name: Smoke test (headless Chrome)
        working-directory: packages/nextjs
        run: node scripts/smoke-hydration.mjs http://localhost:3010

  audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Yarn audit (production deps, high severity and above)
        run: yarn audit --groups dependencies --level high
